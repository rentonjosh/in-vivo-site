<style>html.iv-loaded:not(.iv-on) body > .content{visibility:hidden}</style><script>/* in vivo: loads the latest build from GitHub (pinned to the newest commit so no cache can serve an old one); never inside Cargo's editor */ (function () { try { if (window.top !== window.self) return; } catch (e) { return; } if (/^\/edit/.test(location.pathname)) return; var d = document, h = d.documentElement, R = 'rentonjosh/in-vivo-site'; h.classList.add('iv-loaded'); function go(ref) { var b = 'https://cdn.jsdelivr.net/gh/' + R + '@' + ref + '/dist/', l = d.createElement('link'), s = d.createElement('script'); l.rel = 'stylesheet'; l.href = b + 'app.css'; d.head.appendChild(l); s.src = b + 'app.js'; d.head.appendChild(s); } fetch('https://api.github.com/repos/' + R + '/commits/main', { headers: { Accept: 'application/vnd.github.sha' } }).then(function (r) { return r.ok ? r.text() : ''; }).then(function (x) { go(/^[0-9a-f]{40}$/.test(x) ? x : 'main'); }, function () { go('main'); }); setTimeout(function () { if (!(window.inVivo && window.inVivo.booted)) h.classList.remove('iv-loaded'); }, 8000); })();</script>
